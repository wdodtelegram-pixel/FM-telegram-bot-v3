name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d fm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fm_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fm_test
      SECRET_KEY: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            api/requirements.txt
      - run: pip install -r api/requirements.txt pytest
      - run: alembic -c migrations/alembic.ini upgrade head
      - run: pytest -q

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The Compose file is valid
        run: TELEGRAM_BOT_TOKEN=123456789:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA SECRET_KEY=ci docker compose config -q
      - name: The images build
        run: |
          docker build -t fm-control-bot .
          docker build -f api/Dockerfile -t fm-control-api .
          docker build -t fm-control-web web
