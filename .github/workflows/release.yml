# Publishes the one-click download.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# builds multi-arch (Intel/AMD and Apple Silicon/ARM) images into GitHub Container Registry and attaches
# FM-Control-<version>.zip (launchers for Mac and Windows) to a GitHub Release. People download the zip,
# double-click, and the launcher pulls these images.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: fm-control-bot
            context: .
            file: Dockerfile
          - name: fm-control-api
            context: .
            file: api/Dockerfile
          - name: fm-control-web
            context: web
            file: web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry paths must be lowercase)
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:${{ github.ref_name }}
            ghcr.io/${{ env.OWNER }}/${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the download
        run: python tools/make_release.py "${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FM-Control-*.zip
            dist/FM-Control-*.zip.sha256
          generate_release_notes: true
