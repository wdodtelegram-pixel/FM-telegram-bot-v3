server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One origin for the browser: /api goes to the Flask service, so there is
    # no CORS and the site works the same in development and production.
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 6m;      # CSV uploads
    }

    # BrowserRouter: every unknown path falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
